  <text x="520" y="455" class="attr-text">quantity</text>

  <ellipse cx="335" cy="350" rx="28" ry="14" class="attr-ellipse"/>
  <text x="335" y="350" class="attr-text">remarks</text>

  <!-- Entity Box -->
  <rect x="360" y="376" width="98" height="34" class="entity-rect"/>
  <text x="408" y="392" class="entity-text">STOCK MOVEMENTS</text>


  <!-- ============================================================== -->
  <!-- 11. ENTITY 8: INVENTORY (Bottom Center-Right)                  -->
  <!-- ============================================================== -->
  <!-- Attribute lines -->
  <line x1="638" y1="393" x2="540" y2="425" class="conn-line"/>
  <line x1="638" y1="393" x2="600" y2="465" class="conn-line"/>
  <line x1="638" y1="393" x2="685" y2="465" class="conn-line"/>
  <line x1="638" y1="393" x2="735" y2="425" class="conn-line"/>

