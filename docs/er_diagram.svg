<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 487" width="2048" height="974">
  <defs>
    <!-- Authentic draw.io grid pattern: 10px light grid -->
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#e5e5e5" stroke-width="0.6"/>
    </pattern>
  </defs>

  <style>
    /* draw.io native styling */
    .bg { fill: #ffffff; }
    .grid-layer { fill: url(#grid); }

    /* Entities (Rectangles) */
    .entity-rect { fill: #d5e8d4; stroke: #82b366; stroke-width: 1.2; }
    .entity-text { font-family: Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; letter-spacing: 0.2px; }

    /* Relationships (Diamonds) */
    .rel-diamond { fill: #fff2cc; stroke: #d6b656; stroke-width: 1.2; }
    .rel-text { font-family: Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #000000; text-anchor: middle; dominant-baseline: central; }

    /* Attributes (Ellipses) */
    .attr-ellipse { fill: #dae8fc; stroke: #6c8ebf; stroke-width: 1.1; }
    .attr-text { font-family: Helvetica, Arial, sans-serif; font-size: 9px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .attr-pk { font-family: Helvetica, Arial, sans-serif; font-size: 9px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; text-decoration: underline; }

    /* Connectors */
    .conn-line { stroke: #555555; stroke-width: 1.1; fill: none; }
    .rel-line { stroke: #333333; stroke-width: 1.2; fill: none; }

    /* Cardinality: natural draw.io edge text */
    .card-text { font-family: Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
  </style>

  <!-- Canvas Background with Grid -->
  <rect width="1024" height="487" class="bg"/>
  <rect width="1024" height="487" class="grid-layer"/>


  <!-- ============================================================== -->
  <!-- 1. RELATIONSHIP LINES                                          -->
  <!-- ============================================================== -->

  <!-- CATEGORIES (203, 81) to PRODUCTS (511, 194) via contains (401, 80) -->
  <path d="M 255 81 L 511 81 L 511 174" class="rel-line"/>

  <!-- SUPPLIERS (868, 81) to PURCHASES (868, 239) via supplies (867, 154) -->
  <line x1="868" y1="98" x2="868" y2="222" class="rel-line"/>

  <!-- PURCHASES (868, 239) to PURCHASE ITEMS (868, 393) via includes (867, 316) -->
  <line x1="868" y1="256" x2="868" y2="376" class="rel-line"/>

  <!-- PRODUCTS (511, 194) to PURCHASE ITEMS (868, 393) via purchased_as (734, 316) -->
  <line x1="564" y1="205" x2="805" y2="385" class="rel-line"/>

  <!-- SALES (163, 239) to SALE ITEMS (164, 393) via includes (164, 316) -->
  <line x1="163" y1="256" x2="164" y2="376" class="rel-line"/>

  <!-- PRODUCTS (511, 194) to SALE ITEMS (164, 393) via sold_as (300, 316) -->
  <line x1="458" y1="205" x2="217" y2="385" class="rel-line"/>

  <!-- PRODUCTS (511, 194) to STOCK MOVEMENTS (400, 393) via records (408, 316) -->
  <line x1="485" y1="214" x2="400" y2="376" class="rel-line"/>

  <!-- PRODUCTS (511, 194) to INVENTORY (642, 393) via has (599, 316) -->
  <line x1="538" y1="214" x2="642" y2="376" class="rel-line"/>


  <!-- ============================================================== -->
  <!-- 2. RELATIONSHIP DIAMONDS                                       -->
  <!-- ============================================================== -->

  <!-- contains: (401, 80) -->
  <polygon points="401,65 448,80 401,95 354,80" class="rel-diamond"/>
  <text x="401" y="80" class="rel-text">contains</text>

  <!-- supplies: (867, 154) -->
  <polygon points="867,136 903,154 867,172 831,154" class="rel-diamond"/>
  <text x="867" y="154" class="rel-text">supplies</text>

  <!-- includes (Purchases): (867, 316) -->
  <polygon points="867,298 903,316 867,334 831,316" class="rel-diamond"/>
  <text x="867" y="316" class="rel-text">includes</text>

  <!-- purchased_as: (734, 316) - widened to 96px so text fits comfortably -->
  <polygon points="734,298 782,316 734,334 686,316" class="rel-diamond"/>
  <text x="734" y="316" class="rel-text">purchased_as</text>

  <!-- includes (Sales): (164, 316) -->
  <polygon points="164,298 200,316 164,334 128,316" class="rel-diamond"/>
  <text x="164" y="316" class="rel-text">includes</text>

  <!-- sold_as: (300, 316) -->
  <polygon points="300,298 335,316 300,334 265,316" class="rel-diamond"/>
  <text x="300" y="316" class="rel-text">sold_as</text>

  <!-- records: (408, 316) -->
  <polygon points="408,298 444,316 408,334 372,316" class="rel-diamond"/>
  <text x="408" y="316" class="rel-text">records</text>

  <!-- has: (599, 316) -->
  <polygon points="599,298 630,316 599,334 568,316" class="rel-diamond"/>
  <text x="599" y="316" class="rel-text">has</text>


  <!-- ============================================================== -->
  <!-- 3. CARDINALITY LABELS                                          -->
  <!-- ============================================================== -->

  <!-- Categories contains Products (1 : M) -->
  <text x="272" y="72" class="card-text">1</text>
  <text x="522" y="158" class="card-text">M</text>

  <!-- Suppliers supplies Purchases (1 : M) -->
  <text x="878" y="112" class="card-text">1</text>
  <text x="878" y="208" class="card-text">M</text>

  <!-- Purchases includes Purchase Items (1 : M) -->
  <text x="878" y="270" class="card-text">1</text>
  <text x="878" y="362" class="card-text">M</text>

  <!-- Products purchased_as Purchase Items (1 : M) -->
  <text x="585" y="222" class="card-text">1</text>
  <text x="795" y="365" class="card-text">M</text>

  <!-- Sales includes Sale Items (1 : M) -->
  <text x="175" y="270" class="card-text">1</text>
  <text x="175" y="362" class="card-text">M</text>

  <!-- Products sold_as Sale Items (1 : M) -->
  <text x="440" y="222" class="card-text">1</text>
  <text x="235" y="365" class="card-text">M</text>

  <!-- Products records Stock Movements (1 : M) -->
  <text x="470" y="235" class="card-text">1</text>
  <text x="420" y="362" class="card-text">M</text>

  <!-- Products has Inventory (1 : 1) -->
  <text x="550" y="235" class="card-text">1</text>
  <text x="630" y="362" class="card-text">1</text>


  <!-- ============================================================== -->
  <!-- 4. ENTITY 1: CATEGORIES (Top Left)                             -->
  <!-- ============================================================== -->
  <!-- Attribute lines -->
  <line x1="203" y1="81" x2="95" y2="34" class="conn-line"/>
  <line x1="203" y1="81" x2="203" y2="24" class="conn-line"/>
  <line x1="203" y1="81" x2="310" y2="34" class="conn-line"/>

  <!-- Attributes -->
  <ellipse cx="95" cy="34" rx="36" ry="14" class="attr-ellipse"/>
  <text x="95" y="34" class="attr-pk">category_id</text>

  <ellipse cx="203" cy="24" rx="42" ry="14" class="attr-ellipse"/>
  <text x="203" y="24" class="attr-text">category_name</text>

  <ellipse cx="310" cy="34" rx="36" ry="14" class="attr-ellipse"/>
  <text x="310" y="34" class="attr-text">description</text>

  <!-- Entity Box: 104x34 -->
  <rect x="151" y="64" width="104" height="34" class="entity-rect"/>
  <text x="203" y="81" class="entity-text">CATEGORIES</text>


  <!-- ============================================================== -->
  <!-- 5. ENTITY 2: SUPPLIERS (Top Right)                             -->
  <!-- ============================================================== -->
  <!-- Attribute lines -->
  <line x1="868" y1="81" x2="755" y2="34" class="conn-line"/>
  <line x1="868" y1="81" x2="868" y2="24" class="conn-line"/>
  <line x1="868" y1="81" x2="975" y2="34" class="conn-line"/>

  <!-- Attributes -->
  <ellipse cx="755" cy="34" rx="36" ry="14" class="attr-ellipse"/>
  <text x="755" y="34" class="attr-pk">supplier_id</text>

  <ellipse cx="868" cy="24" rx="42" ry="14" class="attr-ellipse"/>
  <text x="868" y="24" class="attr-text">supplier_name</text>

  <ellipse cx="975" cy="34" rx="28" ry="14" class="attr-ellipse"/>
  <text x="975" y="34" class="attr-text">email</text>

  <!-- Entity Box: 100x34 -->
  <rect x="818" y="64" width="100" height="34" class="entity-rect"/>
  <text x="868" y="81" class="entity-text">SUPPLIERS</text>


  <!-- ============================================================== -->
  <!-- 6. ENTITY 3: PRODUCTS (Center Hub)                             -->
  <!-- ============================================================== -->
  <!-- Attribute lines -->
  <line x1="511" y1="194" x2="390" y2="138" class="conn-line"/>
  <line x1="511" y1="194" x2="632" y2="138" class="conn-line"/>
  <line x1="511" y1="194" x2="370" y2="185" class="conn-line"/>
  <line x1="511" y1="194" x2="650" y2="185" class="conn-line"/>
  <line x1="511" y1="194" x2="375" y2="232" class="conn-line"/>

  <!-- Attributes -->
  <ellipse cx="390" cy="138" rx="36" ry="14" class="attr-ellipse"/>
  <text x="390" y="138" class="attr-pk">product_id</text>

  <ellipse cx="632" cy="138" rx="42" ry="14" class="attr-ellipse"/>
  <text x="632" y="138" class="attr-text">product_name</text>

  <ellipse cx="370" cy="185" rx="26" ry="13" class="attr-ellipse"/>
  <text x="370" y="185" class="attr-text">unit</text>

  <ellipse cx="650" cy="185" rx="38" ry="14" class="attr-ellipse"/>
  <text x="650" y="185" class="attr-text">selling_price</text>

  <ellipse cx="375" cy="232" rx="38" ry="14" class="attr-ellipse"/>
  <text x="375" y="232" class="attr-text">reorder_level</text>

  <!-- Entity Box: 106x36 -->
  <rect x="458" y="176" width="106" height="36" class="entity-rect"/>
  <text x="511" y="194" class="entity-text">PRODUCTS</text>


  <!-- ============================================================== -->
  <!-- 7. ENTITY 4: SALES (Middle Left)                               -->
  <!-- ============================================================== -->
  <!-- Attribute lines -->
  <line x1="163" y1="239" x2="50" y2="239" class="conn-line"/>
  <line x1="163" y1="239" x2="95" y2="180" class="conn-line"/>
  <line x1="163" y1="239" x2="275" y2="239" class="conn-line"/>

  <!-- Attributes -->
  <ellipse cx="50" cy="239" rx="30" ry="14" class="attr-ellipse"/>
  <text x="50" y="239" class="attr-pk">sale_id</text>

  <ellipse cx="95" cy="180" rx="32" ry="14" class="attr-ellipse"/>
  <text x="95" y="180" class="attr-text">sale_date</text>

  <ellipse cx="275" cy="239" rx="36" ry="14" class="attr-ellipse"/>
  <text x="275" y="239" class="attr-text">bill_number</text>

  <!-- Entity Box: 96x34 -->
  <rect x="115" y="222" width="96" height="34" class="entity-rect"/>
  <text x="163" y="239" class="entity-text">SALES</text>


  <!-- ============================================================== -->
  <!-- 8. ENTITY 5: PURCHASES (Middle Right)                          -->
  <!-- ============================================================== -->
  <!-- Attribute lines -->
  <line x1="868" y1="239" x2="755" y2="239" class="conn-line"/>
  <line x1="868" y1="239" x2="755" y2="180" class="conn-line"/>
  <line x1="868" y1="239" x2="980" y2="239" class="conn-line"/>

  <!-- Attributes -->
  <ellipse cx="755" cy="239" rx="36" ry="14" class="attr-ellipse"/>
  <text x="755" y="239" class="attr-pk">purchase_id</text>

  <ellipse cx="755" cy="180" rx="36" ry="14" class="attr-ellipse"/>
  <text x="755" y="180" class="attr-text">purchase_date</text>

  <ellipse cx="980" cy="239" rx="40" ry="14" class="attr-ellipse"/>
  <text x="980" y="239" class="attr-text">invoice_number</text>

  <!-- Entity Box: 100x34 -->
  <rect x="818" y="222" width="100" height="34" class="entity-rect"/>
  <text x="868" y="239" class="entity-text">PURCHASES</text>


  <!-- ============================================================== -->
  <!-- 9. ENTITY 6: SALE ITEMS (Bottom Left)                          -->
  <!-- ============================================================== -->
  <!-- Attribute lines -->
  <line x1="164" y1="393" x2="52" y2="340" class="conn-line"/>
  <line x1="164" y1="393" x2="42" y2="393" class="conn-line"/>
  <line x1="164" y1="393" x2="52" y2="448" class="conn-line"/>
  <line x1="164" y1="393" x2="164" y2="465" class="conn-line"/>

  <!-- Attributes: appropriately sized so text sits comfortably inside -->
  <ellipse cx="52" cy="340" rx="38" ry="14" class="attr-ellipse"/>
  <text x="52" y="340" class="attr-pk">sale_item_id</text>

  <ellipse cx="42" cy="393" rx="28" ry="14" class="attr-ellipse"/>
  <text x="42" y="393" class="attr-text">quantity</text>

  <ellipse cx="52" cy="448" rx="44" ry="14" class="attr-ellipse"/>
  <text x="52" y="448" class="attr-text">unit_selling_price</text>

  <ellipse cx="164" cy="465" rx="44" ry="14" class="attr-ellipse"/>
  <text x="164" y="465" class="attr-text">unit_cost_at_sale</text>

  <!-- Entity Box: 106x34 -->
  <rect x="111" y="376" width="106" height="34" class="entity-rect"/>
  <text x="164" y="393" class="entity-text">SALE ITEMS</text>


  <!-- ============================================================== -->
  <!-- 10. ENTITY 7: STOCK MOVEMENTS (Bottom Center-Left)             -->
  <!-- ============================================================== -->
  <!-- Attribute lines -->
  <line x1="400" y1="393" x2="310" y2="355" class="conn-line"/>
  <line x1="400" y1="393" x2="275" y2="440" class="conn-line"/>
  <line x1="400" y1="393" x2="345" y2="465" class="conn-line"/>
  <line x1="400" y1="393" x2="425" y2="465" class="conn-line"/>
  <line x1="400" y1="393" x2="492" y2="440" class="conn-line"/>

  <!-- Attributes: well spaced, non-overlapping -->
  <ellipse cx="310" cy="355" rx="28" ry="13" class="attr-ellipse"/>
  <text x="310" y="355" class="attr-text">remarks</text>

  <ellipse cx="275" cy="440" rx="36" ry="14" class="attr-ellipse"/>
  <text x="275" y="440" class="attr-pk">movement_id</text>

  <ellipse cx="345" cy="465" rx="38" ry="14" class="attr-ellipse"/>
  <text x="345" y="465" class="attr-text">movement_date</text>

  <ellipse cx="425" cy="465" rx="38" ry="14" class="attr-ellipse"/>
  <text x="425" y="465" class="attr-text">movement_type</text>

  <ellipse cx="492" cy="440" rx="26" ry="13" class="attr-ellipse"/>
  <text x="492" y="440" class="attr-text">quantity</text>

  <!-- Entity Box: widened to 134px so "STOCK MOVEMENTS" fits completely inside with padding! -->
  <rect x="333" y="376" width="134" height="34" class="entity-rect"/>
  <text x="400" y="393" class="entity-text">STOCK MOVEMENTS</text>


  <!-- ============================================================== -->
  <!-- 11. ENTITY 8: INVENTORY (Bottom Center-Right)                  -->
  <!-- ============================================================== -->
  <!-- Attribute lines -->
  <line x1="642" y1="393" x2="565" y2="445" class="conn-line"/>
  <line x1="642" y1="393" x2="635" y2="465" class="conn-line"/>
  <line x1="642" y1="393" x2="710" y2="455" class="conn-line"/>
  <line x1="642" y1="393" x2="740" y2="400" class="conn-line"/>

  <!-- Attributes: completely separated from Stock Movements quantity! -->
  <ellipse cx="565" cy="445" rx="32" ry="14" class="attr-ellipse"/>
  <text x="565" y="445" class="attr-pk">product_id</text>

  <ellipse cx="635" cy="465" rx="44" ry="14" class="attr-ellipse"/>
  <text x="635" y="465" class="attr-text">quantity_available</text>

  <ellipse cx="710" cy="455" rx="34" ry="14" class="attr-ellipse"/>
  <text x="710" y="455" class="attr-text">average_cost</text>

  <ellipse cx="740" cy="400" rx="34" ry="14" class="attr-ellipse"/>
  <text x="740" y="400" class="attr-text">last_updated</text>

  <!-- Entity Box: 104x34 -->
  <rect x="590" y="376" width="104" height="34" class="entity-rect"/>
  <text x="642" y="393" class="entity-text">INVENTORY</text>


  <!-- ============================================================== -->
  <!-- 12. ENTITY 9: PURCHASE ITEMS (Bottom Right)                    -->
  <!-- ============================================================== -->
  <!-- Attribute lines: start cleanly outside the box right edge -->
  <line x1="932" y1="380" x2="980" y2="340" class="conn-line"/>
  <line x1="932" y1="393" x2="964" y2="393" class="conn-line"/>
  <line x1="932" y1="406" x2="980" y2="448" class="conn-line"/>
  <line x1="868" y1="410" x2="868" y2="465" class="conn-line"/>

  <!-- Attributes -->
  <ellipse cx="980" cy="340" rx="42" ry="14" class="attr-ellipse"/>
  <text x="980" y="340" class="attr-pk">purchase_item_id</text>

  <ellipse cx="985" cy="393" rx="28" ry="14" class="attr-ellipse"/>
  <text x="985" y="393" class="attr-text">quantity</text>

  <ellipse cx="980" cy="448" rx="30" ry="14" class="attr-ellipse"/>
  <text x="980" y="448" class="attr-text">unit_cost</text>

  <ellipse cx="868" cy="465" rx="32" ry="14" class="attr-ellipse"/>
  <text x="868" y="465" class="attr-text">expiry_date</text>

  <!-- Entity Box: widened to 128px so "PURCHASE ITEMS" fits completely inside with padding! -->
  <rect x="804" y="376" width="128" height="34" class="entity-rect"/>
  <text x="868" y="393" class="entity-text">PURCHASE ITEMS</text>

</svg>