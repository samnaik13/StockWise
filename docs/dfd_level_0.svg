<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="2000" height="1120">
  <defs>
    <!-- Standard black arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    <![CDATA[
    .bg { fill: #ffffff; }
    .title { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: bold; fill: #000000; }
    
    /* Entities and Process */
    .entity-box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
    .process-circle { fill: #ffffff; stroke: #000000; stroke-width: 1.6; }
    
    .entity-text { font-family: Arial, Helvetica, sans-serif; font-size: 13.5px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .entity-sub { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #333333; text-anchor: middle; dominant-baseline: central; }
    
    .process-title { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .process-text { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 500; fill: #111111; text-anchor: middle; dominant-baseline: central; }
    
    /* Connectors and Flow Labels */
    .flow-line { stroke: #000000; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .flow-label { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 500; fill: #000000; }
    .flow-label-center { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 500; fill: #000000; text-anchor: middle; }
    .flow-label-right { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 500; fill: #000000; text-anchor: end; }
    ]]>
  </style>

  <!-- Pure White Canvas Background -->
  <rect width="1000" height="560" class="bg"/>

  <!-- Top-Left Title -->
  <text x="40" y="45" class="title">0 Level DFD (Context Diagram)</text>


  <!-- 1. DATA FLOW LINES AND LABELS -->

  <!-- Between CUSTOMER (Left) and CENTRAL PROCESS -->
  <!-- Customer to System (Orders and Payments) -->
  <line x1="170" y1="315" x2="368" y2="315" class="flow-line"/>
  <text x="268" y="303" class="flow-label-center">Grocery Orders &amp; Payments</text>

  <!-- System to Customer (Bills and Receipts) -->
  <line x1="370" y1="355" x2="173" y2="355" class="flow-line"/>
  <text x="268" y="373" class="flow-label-center">Bill Invoices &amp; Return Receipts</text>


  <!-- Between SUPPLIER (Top) and CENTRAL PROCESS -->
  <!-- Supplier to System (Invoices and Delivery Batches) at x=465 -->
  <line x1="465" y1="130" x2="465" y2="242" class="flow-line"/>
  <text x="452" y="180" class="flow-label-right">Wholesale Invoices &amp;</text>
  <text x="452" y="196" class="flow-label-right">Stock Delivery Batches</text>

  <!-- System to Supplier (Purchase Orders and Returns) at x=535 -->
  <line x1="535" y1="242" x2="535" y2="133" class="flow-line"/>
  <text x="548" y="180" class="flow-label">Purchase Orders &amp;</text>
  <text x="548" y="196" class="flow-label">Supplier Return Requests</text>


  <!-- Between ADMIN (Right) and CENTRAL PROCESS -->
  <!-- Admin to System (Catalog and Stock Adjustments) -->
  <line x1="830" y1="355" x2="633" y2="355" class="flow-line"/>
  <text x="732" y="373" class="flow-label-center">Product Catalog &amp; Stock Adjustments</text>

  <!-- System to Admin (Reports and Stock Alerts) -->
  <line x1="630" y1="315" x2="827" y2="315" class="flow-line"/>
  <text x="732" y="303" class="flow-label-center">Stock Alerts &amp; Financial Reports</text>


  <!-- 2. CENTRAL PROCESS (Single Bubble / Circle) -->
  <!-- Center at x=500, y=335, rx=130, ry=90 -->
  <ellipse cx="500" cy="335" rx="130" ry="90" class="process-circle"/>
  <text x="500" y="305" class="process-title">StockWise</text>
  <text x="500" y="328" class="process-text">Grocery Store Inventory</text>
  <text x="500" y="348" class="process-text">Management System</text>
  <text x="500" y="370" class="entity-sub">(0.0)</text>


  <!-- 3. EXTERNAL ENTITIES (Rectangles) -->

  <!-- ENTITY 1: Customer (Left) -->
  <rect x="40" y="295" width="130" height="80" class="entity-box"/>
  <text x="105" y="330" class="entity-text">Customer</text>
  <text x="105" y="348" class="entity-sub">(Walk-in Buyer)</text>

  <!-- ENTITY 2: Wholesale Supplier (Top) -->
  <rect x="420" y="65" width="160" height="65" class="entity-box"/>
  <text x="500" y="92" class="entity-text">Wholesale Supplier</text>
  <text x="500" y="110" class="entity-sub">(Vendor / Distributor)</text>

  <!-- ENTITY 3: Store Admin (Right) -->
  <rect x="830" y="295" width="130" height="80" class="entity-box"/>
  <text x="895" y="330" class="entity-text">Store Admin</text>
  <text x="895" y="348" class="entity-sub">(Manager / Cashier)</text>

</svg>