<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 1140" width="2040" height="2280">
  <defs>
    <!-- Standard black arrowhead matching reference diagram -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#000000"/>
    </marker>
  </defs>

  <style>
    <![CDATA[
    .bg { fill: #ffffff; }

    /* Entities (Simple Rectangles) */
    .entity-box { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
    .entity-text { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }

    /* Processes (Simple Circles) */
    .process-circle { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
    .process-title { font-family: Arial, Helvetica, sans-serif; font-size: 12.5px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }

    /* Data Stores (Open Rectangle with left compartment) */
    .store-line { stroke: #000000; stroke-width: 1.5; }
    .store-text { font-family: Arial, Helvetica, sans-serif; font-size: 13.5px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }

    /* Connectors & Clean Flow Labels */
    .flow-line { stroke: #000000; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    .flow-label { font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 500; fill: #000000; paint-order: stroke fill; stroke: #ffffff; stroke-width: 3.5px; stroke-linejoin: round; }
    .flow-label-center { font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 500; fill: #000000; text-anchor: middle; paint-order: stroke fill; stroke: #ffffff; stroke-width: 3.5px; stroke-linejoin: round; }

    /* Bottom Title matching reference */
    .dfd-title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: bold; fill: #000000; text-anchor: middle; }
    .dfd-sub { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #444444; text-anchor: middle; }
    ]]>
  </style>

  <!-- Pure White Background -->
  <rect width="1020" height="1140" class="bg"/>


  <!-- ============================================================== -->
  <!-- 1. EXTERNAL ENTITIES (Terminators)                             -->
  <!-- ============================================================== -->

  <!-- Top-Left Entity: Store Admin / Cashier -->
  <g transform="translate(35, 45)">
    <rect x="0" y="0" width="165" height="75" class="entity-box"/>
    <text x="82" y="31" class="entity-text">Store Admin /</text>
    <text x="82" y="49" class="entity-text">Cashier</text>
  </g>

  <!-- Bottom-Left Entity: Retail Customer -->
  <g transform="translate(35, 875)">
    <rect x="0" y="0" width="165" height="75" class="entity-box"/>
    <text x="82" y="31" class="entity-text">Retail</text>
    <text x="82" y="49" class="entity-text">Customer</text>
  </g>


  <!-- ============================================================== -->
  <!-- 2. FUNCTIONAL PROCESSES (Circles in Center Column)             -->
  <!-- ============================================================== -->

  <!-- Process 1: Manage Products (cy = 82) -->
  <circle cx="490" cy="82" r="46" class="process-circle"/>
  <text x="490" y="74" class="process-title">Manage</text>
  <text x="490" y="91" class="process-title">Products</text>

  <!-- Process 2: Purchase / Stock-In (cy = 280) -->
  <circle cx="490" cy="280" r="46" class="process-circle"/>
  <text x="490" y="272" class="process-title">Purchase /</text>
  <text x="490" y="289" class="process-title">Stock-In</text>

  <!-- Process 3: Stock Adjustment (cy = 480) -->
  <circle cx="490" cy="480" r="46" class="process-circle"/>
  <text x="490" y="472" class="process-title">Stock</text>
  <text x="490" y="489" class="process-title">Adjustment</text>

  <!-- Process 4: View Reports (cy = 680) -->
  <circle cx="490" cy="680" r="46" class="process-circle"/>
  <text x="490" y="672" class="process-title">View</text>
  <text x="490" y="689" class="process-title">Reports</text>

  <!-- Process 5: Counter Billing (cy = 912) -->
  <circle cx="490" cy="912" r="46" class="process-circle"/>
  <text x="490" y="904" class="process-title">Counter</text>
  <text x="490" y="921" class="process-title">Billing</text>


  <!-- ============================================================== -->
  <!-- 3. DATA STORES (Open-ended Boxes on Right)                     -->
  <!-- ============================================================== -->

  <!-- Store 1: Product Details (y = 52) -->
  <g transform="translate(760, 52)">
    <line x1="0" y1="0" x2="220" y2="0" class="store-line"/>
    <line x1="0" y1="60" x2="220" y2="60" class="store-line"/>
    <line x1="0" y1="0" x2="0" y2="60" class="store-line"/>
    <line x1="30" y1="0" x2="30" y2="60" class="store-line"/>
    <text x="125" y="30" class="store-text">product details</text>
  </g>

  <!-- Store 2: Purchase Details (y = 250) -->
  <g transform="translate(760, 250)">
    <line x1="0" y1="0" x2="220" y2="0" class="store-line"/>
    <line x1="0" y1="60" x2="220" y2="60" class="store-line"/>
    <line x1="0" y1="0" x2="0" y2="60" class="store-line"/>
    <line x1="30" y1="0" x2="30" y2="60" class="store-line"/>
    <text x="125" y="30" class="store-text">purchase details</text>
  </g>

  <!-- Store 3: Inventory Details (y = 450 to 570, height = 120) -->
  <g transform="translate(760, 450)">
    <line x1="0" y1="0" x2="220" y2="0" class="store-line"/>
    <line x1="0" y1="120" x2="220" y2="120" class="store-line"/>
    <line x1="0" y1="0" x2="0" y2="120" class="store-line"/>
    <line x1="30" y1="0" x2="30" y2="120" class="store-line"/>
    <text x="125" y="60" class="store-text">inventory details</text>
  </g>

  <!-- Store 4: Sales Details (y = 882) -->
  <g transform="translate(760, 882)">
    <line x1="0" y1="0" x2="220" y2="0" class="store-line"/>
    <line x1="0" y1="60" x2="220" y2="60" class="store-line"/>
    <line x1="0" y1="0" x2="0" y2="60" class="store-line"/>
    <line x1="30" y1="0" x2="30" y2="60" class="store-line"/>
    <text x="125" y="30" class="store-text">sales details</text>
  </g>


  <!-- ============================================================== -->
  <!-- 4. DATA FLOWS: ADMIN -> PROCESSES (LEFT SIDE)                  -->
  <!-- ============================================================== -->

  <!-- Admin <-> Manage Products (Horizontal) -->
  <line x1="200" y1="67" x2="442" y2="67" class="flow-line"/>
  <text x="320" y="59" class="flow-label-center">Product &amp; Category Info</text>

  <line x1="444" y1="97" x2="202" y2="97" class="flow-line"/>
  <text x="320" y="110" class="flow-label-center">Response / Status</text>

  <!-- Admin <-> Purchase / Stock-In (Drop Bus at x=170, 150) -->
  <path d="M 170 120 L 170 265 L 442 265" class="flow-line"/>
  <text x="306" y="257" class="flow-label-center">Purchase Invoice &amp; Items</text>

  <path d="M 444 295 L 150 295 L 150 122" class="flow-line"/>
  <text x="306" y="308" class="flow-label-center">Purchase Confirmation</text>

  <!-- Admin <-> Stock Adjustment (Drop Bus at x=125, 105) -->
  <path d="M 125 120 L 125 465 L 442 465" class="flow-line"/>
  <text x="290" y="457" class="flow-label-center">Damage / Spoilage Entry</text>

  <path d="M 444 495 L 105 495 L 105 122" class="flow-line"/>
  <text x="290" y="508" class="flow-label-center">Adjustment Status</text>

  <!-- Admin <-> View Reports (Drop Bus at x=80, 60) -->
  <path d="M 80 120 L 80 665 L 442 665" class="flow-line"/>
  <text x="270" y="657" class="flow-label-center">Request Reports &amp; Alerts</text>

  <path d="M 444 695 L 60 695 L 60 122" class="flow-line"/>
  <text x="270" y="708" class="flow-label-center">Low-Stock &amp; Profit Reports</text>


  <!-- ============================================================== -->
  <!-- 5. DATA FLOWS: CUSTOMER <-> COUNTER BILLING (BOTTOM LEFT)      -->
  <!-- ============================================================== -->

  <line x1="200" y1="897" x2="442" y2="897" class="flow-line"/>
  <text x="320" y="889" class="flow-label-center">Item Selection &amp; Payment</text>

  <line x1="444" y1="927" x2="202" y2="927" class="flow-line"/>
  <text x="320" y="940" class="flow-label-center">Printed Bill Receipt</text>


  <!-- ============================================================== -->
  <!-- 6. DATA FLOWS: PROCESSES <-> DATA STORES (RIGHT SIDE)          -->
  <!-- ============================================================== -->

  <!-- Process 1 <-> Product Details (Horizontal) -->
  <line x1="536" y1="67" x2="758" y2="67" class="flow-line"/>
  <text x="645" y="59" class="flow-label-center">Check / Save Product</text>

  <line x1="760" y1="97" x2="538" y2="97" class="flow-line"/>
  <text x="645" y="110" class="flow-label-center">Response</text>


  <!-- Process 2 <-> Purchase Details (Horizontal) -->
  <line x1="536" y1="265" x2="758" y2="265" class="flow-line"/>
  <text x="645" y="257" class="flow-label-center">Save Purchase Record</text>

  <line x1="760" y1="295" x2="538" y2="295" class="flow-line"/>
  <text x="645" y="308" class="flow-label-center">Response</text>

  <!-- Process 2 -> Inventory Details (Update Stock) - Drop at x=730 -->
  <path d="M 526 312 L 730 312 L 730 470 L 758 470" class="flow-line"/>
  <text x="625" y="324" class="flow-label-center">Update Stock &amp; Cost</text>


  <!-- Process 3 <-> Inventory Details (Stock Adjustment - Horizontal) -->
  <line x1="536" y1="480" x2="758" y2="480" class="flow-line"/>
  <text x="640" y="472" class="flow-label-center">Deduct Damaged Stock</text>

  <line x1="760" y1="510" x2="538" y2="510" class="flow-line"/>
  <text x="640" y="523" class="flow-label-center">Response</text>


  <!-- Process 4 <-> Inventory Details (View Reports - Step Up to Store 3) -->
  <path d="M 536 665 L 685 665 L 685 540 L 758 540" class="flow-line"/>
  <text x="605" y="657" class="flow-label-center">Check Stock Levels</text>

  <path d="M 760 558 L 665 558 L 665 695 L 538 695" class="flow-line"/>
  <text x="605" y="708" class="flow-label-center">Stock Valuation Data</text>


  <!-- Process 5 <-> Sales Details (Counter Billing - Horizontal) -->
  <line x1="536" y1="897" x2="758" y2="897" class="flow-line"/>
  <text x="645" y="889" class="flow-label-center">Save Sales Bill &amp; Items</text>

  <line x1="760" y1="927" x2="538" y2="927" class="flow-line"/>
  <text x="645" y="940" class="flow-label-center">Response</text>

  <!-- Process 5 -> Inventory Details (Check & Deduct Stock) - Rise at x=735 -->
  <path d="M 526 880 L 735 880 L 735 570 L 758 570" class="flow-line"/>
  <text x="630" y="872" class="flow-label-center">Check &amp; Deduct Stock</text>


  <!-- ============================================================== -->
  <!-- 7. BOTTOM TITLE (Exact Match to Reference Diagram)             -->
  <!-- ============================================================== -->

  <text x="510" y="1055" class="dfd-title">level 1 DFD</text>
  <text x="510" y="1085" class="dfd-sub">StockWise — Grocery Store Inventory Management System</text>

</svg>